<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#f8fafc"/>
<text x="50" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172033">ROC curve and Cost matrix</text>
<text x="50" y="91" font-family="sans-serif" font-size="17" fill="#64748b">ROC-AUC = 0.833 · threshold = 0.50 · cost = FP×1 + FN×4 = 6</text><line x1="120" y1="330" x2="720" y2="110" stroke="#e1e6f0" stroke-dasharray="7 7" stroke-width="2"/><path d="M120 330 L720 110" stroke="#94a3b8" stroke-width="2"/><polyline points="120.0,330.0 120.0,275.0 120.0,220.0 220.0,220.0 220.0,165.0 320.0,165.0 420.0,165.0 420.0,110.0 520.0,110.0 620.0,110.0 720.0,110.0 720.0,110.0" fill="none" stroke="#db2777" stroke-width="5" stroke-linejoin="round"/><text x="420.0" y="385" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">false-positive rate</text><text x="78" y="220" transform="rotate(-90 78 220)" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">true-positive rate</text><text x="660" y="128" font-family="sans-serif" font-size="16" font-weight="bold" fill="#172033">At t = 0.50</text><text x="660" y="151" font-family="sans-serif" font-size="13" fill="#475569">actual × predicted</text><rect x="160" y="150" width="220" height="52" rx="8" fill="#e8f8f5"/><text x="270" y="171" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">TP: count 3</text><text x="270" y="193" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#172033">3 × 0 = 0</text><rect x="430" y="150" width="220" height="52" rx="8" fill="#fff2e8"/><text x="540" y="171" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">FN: count 1</text><text x="540" y="193" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#172033">1 × 4 = 4</text><rect x="160" y="220" width="220" height="52" rx="8" fill="#fff2e8"/><text x="270" y="241" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">FP: count 2</text><text x="270" y="263" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#172033">2 × 1 = 2</text><rect x="430" y="220" width="220" height="52" rx="8" fill="#e8f8f5"/><text x="540" y="241" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">TN: count 4</text><text x="540" y="263" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#172033">4 × 0 = 0</text></svg>