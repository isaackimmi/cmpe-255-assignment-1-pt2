<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#f8fafc"/>
<text x="50" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172033">Backpropagation through an affine neuron</text>
<text x="50" y="91" font-family="sans-serif" font-size="17" fill="#64748b">x,w → multiply → + b → ŷ → L · local derivatives multiply backward</text><circle cx="105" cy="190" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="105" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">x = 2</text><circle cx="290" cy="190" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="290" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">w×x</text><circle cx="455" cy="190" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="455" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">+ b</text><circle cx="620" cy="190" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="620" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">ŷ = 7.0</text><circle cx="785" cy="190" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="785" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">L = 4.5</text><line x1="145" y1="190" x2="250" y2="190" stroke="#3b6cf5" stroke-width="3"/><line x1="330" y1="190" x2="415" y2="190" stroke="#3b6cf5" stroke-width="3"/><line x1="495" y1="190" x2="580" y2="190" stroke="#3b6cf5" stroke-width="3"/><line x1="660" y1="190" x2="745" y2="190" stroke="#3b6cf5" stroke-width="3"/><text x="445" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b6cf5">forward pass →</text><text x="445" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#db2777">← backward: dL/dŷ = -3.0 · dL/dw = -6.0 · dL/db = -3.0</text><text x="445" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#71809a">local factors: dŷ/d(w×x) = 1 · d(w×x)/dw = x = 2 · dŷ/db = 1</text><text x="445" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">one-neuron affine model, not a two-layer network</text></svg>