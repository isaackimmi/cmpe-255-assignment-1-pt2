<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#f8fafc"/>
<text x="50" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172033">Backpropagation through an affine neuron</text>
<text x="50" y="91" font-family="sans-serif" font-size="17" fill="#64748b">x,w → multiply → + b → ŷ → L · local derivatives multiply backward</text><defs><marker id="arrow-forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#3b6cf5"/></marker><marker id="arrow-backward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d95d9b"/></marker></defs><circle cx="105" cy="150" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="105" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">x = 2</text><circle cx="105" cy="285" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="105" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">w = 3</text><circle cx="290" cy="215" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="290" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">w×x</text><circle cx="430" cy="335" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="430" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">b = 1</text><circle cx="495" cy="215" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="495" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">+ b</text><circle cx="665" cy="215" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="665" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">ŷ = 7.0</text><circle cx="830" cy="215" r="38" fill="#eef2ff" stroke="#3b6cf5" stroke-width="2"/><text x="830" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#172033">L = 4.5</text><line x1="143" y1="150" x2="252" y2="215" stroke="#3b6cf5" stroke-width="3" marker-end="url(#arrow-forward)"/><line x1="143" y1="285" x2="252" y2="225" stroke="#3b6cf5" stroke-width="3" marker-end="url(#arrow-forward)"/><line x1="328" y1="215" x2="457" y2="215" stroke="#3b6cf5" stroke-width="3" marker-end="url(#arrow-forward)"/><line x1="468" y1="335" x2="476" y2="253" stroke="#3b6cf5" stroke-width="3" marker-end="url(#arrow-forward)"/><line x1="533" y1="215" x2="627" y2="215" stroke="#3b6cf5" stroke-width="3" marker-end="url(#arrow-forward)"/><line x1="703" y1="215" x2="792" y2="215" stroke="#3b6cf5" stroke-width="3" marker-end="url(#arrow-forward)"/><path d="M792 245 H703" fill="none" stroke="#d95d9b" stroke-width="3" marker-end="url(#arrow-backward)"/><path d="M627 245 H533" fill="none" stroke="#d95d9b" stroke-width="3" marker-end="url(#arrow-backward)"/><path d="M457 245 H328" fill="none" stroke="#d95d9b" stroke-width="3" marker-end="url(#arrow-backward)"/><path d="M476 245 C470 282 448 300 430 297" fill="none" stroke="#d95d9b" stroke-width="3" marker-end="url(#arrow-backward)"/><path d="M252 242 C210 270 175 285 143 285" fill="none" stroke="#d95d9b" stroke-width="3" marker-end="url(#arrow-backward)"/><text x="450" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b6cf5">forward pass →</text><text x="750" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#d95d9b">dL/dŷ = -3.0</text><text x="580" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#d95d9b">dŷ/d(w×x) = 1</text><text x="450" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#d95d9b">dŷ/db = 1</text><text x="205" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#d95d9b">d(w×x)/dw = x = 2</text><text x="450" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#db2777">backward results: dL/dw = -6.0 · dL/db = -3.0</text><text x="450" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#71809a">pink arrows branch the loss gradient to both parameters</text></svg>